name: One-shot promoted stats patch

on:
  push:
    branches: [chatgpt/promoted-team-stats]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/promoted-team-stats
          fetch-depth: 0
      - name: Patch exact _fit_stats block
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('football/src/futbol_pred/dashboard.py')
          text = path.read_text(encoding='utf-8')
          old = '''def _fit_stats(league: str, season: int):
              """Ajusta props y pseudo-xG con hasta tres temporadas gratuitas."""
              if league not in ("laliga", "segunda"):
                  return None
              try:
                  from .ingest.football_data_uk import FootballDataUKClient
                  from .model.stats_markets import StatsPredictor

                  client = FootballDataUKClient()
                  rows = []
                  for back in (2, 1, 0):
                      try:
                          rows.extend(client.get_stats(league, season - back))
                      except Exception:
                          continue
                  return StatsPredictor().fit(rows)
              except Exception:
                  return None
          '''
          new = '''def _fit_stats(league: str, season: int):
              """Ajusta props con liga objetivo + memoria de equipos que cambiaron de división.

              La otra división nunca entra en medias, dispersión, pseudo-xG ni gate
              temporal: solo aporta acumuladores por equipo al StatsPredictor.
              """
              if league not in ("laliga", "segunda"):
                  return None
              try:
                  from .ingest.football_data_uk import FootballDataUKClient
                  from .model.stats_markets import StatsPredictor

                  client = FootballDataUKClient()
                  rows = []
                  for back in (2, 1, 0):
                      try:
                          rows.extend(client.get_stats(league, season - back))
                      except Exception:
                          continue

                  other = "segunda" if league == "laliga" else "laliga"
                  auxiliary = []
                  for back in (2, 1):
                      try:
                          auxiliary.extend(client.get_stats(other, season - back))
                      except Exception:
                          continue
                  return StatsPredictor().fit(rows, auxiliary_matches=auxiliary)
              except Exception:
                  return None
          '''
          # Dedent only the code literals; YAML indentation is not part of Python heredoc.
          import textwrap
          old = textwrap.dedent(old)
          new = textwrap.dedent(new)
          if old not in text:
              raise SystemExit('Exact _fit_stats block not found; refusing unsafe patch')
          if text.count(old) != 1:
              raise SystemExit(f'Expected one _fit_stats block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit exact patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add football/src/futbol_pred/dashboard.py
          git diff --cached --check
          git commit -m "Wire cross-division stats for promoted teams"
          git push origin HEAD:chatgpt/promoted-team-stats
