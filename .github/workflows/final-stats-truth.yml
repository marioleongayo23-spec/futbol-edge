name: Final stats truth P3.1

on:
  pull_request:
    paths:
      - "football/src/futbol_pred/final_stats_truth.py"
      - "football/src/futbol_pred/finished_stats.py"
      - "football/tests/test_final_stats_truth.py"
      - "football/tests/test_finished_stats.py"
      - ".github/workflows/final-stats-truth.yml"
      - ".github/workflows/futbol-pred.yml"
  push:
    branches: [main]
    paths:
      - "football/src/futbol_pred/final_stats_truth.py"
      - "football/src/futbol_pred/finished_stats.py"
      - "football/tests/test_final_stats_truth.py"
      - "football/tests/test_finished_stats.py"
      - ".github/workflows/final-stats-truth.yml"
      - ".github/workflows/futbol-pred.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: football
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: football/requirements.txt

      - name: Instalar backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Tests truth postpartido
        run: |
          pytest -q \
            tests/test_finished_stats.py \
            tests/test_final_stats_truth.py

      - name: Verificar aislamiento de producción
        run: |
          python - <<'PY'
          from pathlib import Path
          module = Path("src/futbol_pred/final_stats_truth.py").read_text(encoding="utf-8")
          workflow = Path("../.github/workflows/futbol-pred.yml").read_text(encoding="utf-8")
          dashboard = Path("src/futbol_pred/dashboard.py").read_text(encoding="utf-8")
          hot = Path("src/futbol_pred/hot_refresh.py").read_text(encoding="utf-8")

          assert '"affects_1x2": False' in module
          assert "data-history/final_stats_truth.json" in workflow
          assert "final_stats_truth" not in dashboard
          assert "final_stats_truth" not in hot
          print("P3.1 evaluation-only: truth store separado y sin wiring 1X2")
          PY
