name: One-shot probability quality UI patch

on:
  push:
    branches: [chatgpt/probability-quality-ui]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/probability-quality-ui
          fetch-depth: 0
      - name: Wire panel into App
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/src/App.jsx')
          text = path.read_text(encoding='utf-8')
          old_import = 'import MatchDetail from "./MatchDetail";\n'
          new_import = old_import + 'import ProbabilityQualityPanel from "./ProbabilityQualityPanel";\n'
          if text.count(old_import) != 1:
              raise SystemExit(f'Expected one MatchDetail import, found {text.count(old_import)}')
          text = text.replace(old_import, new_import, 1)
          old_render = '      <AccuracyPanel acc={data.accuracy} />\n      <ModelReport model={data.model} />'
          new_render = '      <ProbabilityQualityPanel quality={perf.probability_quality} />\n      <AccuracyPanel acc={data.accuracy} />\n      <ModelReport model={data.model} />'
          if text.count(old_render) != 1:
              raise SystemExit(f'Expected one Datos metrics anchor, found {text.count(old_render)}')
          text = text.replace(old_render, new_render, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Validate and commit
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/App.jsx
          git commit -m "Show probability quality in Datos y modelos"
          git push origin HEAD:chatgpt/probability-quality-ui
