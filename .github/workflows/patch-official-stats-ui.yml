name: Apply official stats UI patch on PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'chatgpt/official-live-stats-ui' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/official-live-stats-ui
          fetch-depth: 0
      - name: Insert component in MatchDetail exactly
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/src/MatchDetail.jsx')
          text = path.read_text(encoding='utf-8')

          old_import = 'import { marketMovementRows } from "./markets";\n'
          new_import = old_import + 'import OfficialStatsPanel from "./OfficialStatsPanel";\n'
          if text.count(old_import) != 1:
              raise SystemExit(f'market import count={text.count(old_import)}')
          if 'OfficialStatsPanel from "./OfficialStatsPanel"' not in text:
              text = text.replace(old_import, new_import, 1)

          anchor = '      {m.alineacion && <div className="section-anchor" id="match-lineup"><Alineacion m={m} a={m.alineacion} /></div>}\n'
          insert = '      <OfficialStatsPanel match={m} />\n\n' + anchor
          if text.count(anchor) != 1:
              raise SystemExit(f'lineup anchor count={text.count(anchor)}')
          if '<OfficialStatsPanel match={m} />' not in text:
              text = text.replace(anchor, insert, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Validate and commit
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/MatchDetail.jsx
          git commit -m "Show official API-Football live match stats"
          git push origin HEAD:chatgpt/official-live-stats-ui
