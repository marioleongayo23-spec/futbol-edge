name: vercel production contract

# Contrato de producción para cambios de SPA/configuración.
# La integración Git de Vercel está desactivada para no consumir la cuota Hobby
# con commits de datos. El despliegue real lo hace deploy-vercel.yml por CLI.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "vercel.json"
      - "scripts/**"
      - ".nvmrc"
      - ".github/workflows/vercel-production-contract.yml"
  pull_request:
    paths:
      - "app/**"
      - "vercel.json"
      - "scripts/**"
      - ".nvmrc"
      - ".github/workflows/vercel-production-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-production-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Validar configuración de despliegue
        run: |
          python - <<'PY'
          import json
          cfg = json.load(open('vercel.json', encoding='utf-8'))
          assert cfg.get('git', {}).get('deploymentEnabled') is False, 'El auto-deploy Git debe permanecer desactivado para evitar churn de cuota'
          assert cfg.get('buildCommand') == 'bash scripts/vercel-build.sh'
          assert cfg.get('outputDirectory') == 'app/dist'
          print('Configuración de Vercel OK')
          PY

      - name: Validar frontend
        working-directory: app
        run: |
          npm ci
          npm test
          npm run lint
          npm run build

      - name: Verificar runtime production-only sin vulnerabilidades altas
        working-directory: app
        run: npm audit --omit=dev --audit-level=high

      - name: Verificar canal de datos vivo
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 \
            "https://raw.githubusercontent.com/marioleongayo23-spec/futbol-edge/main/football/data/dashboard.json?t=$(date +%s)" \
            -o /tmp/dashboard.json
          python - <<'PY'
          import json
          from datetime import datetime, timezone

          with open('/tmp/dashboard.json', encoding='utf-8') as fh:
              d = json.load(fh)
          assert d.get('feed_quality', {}).get('valid') is True, 'feed_quality.valid != true'
          assert len(d.get('matches', [])) >= 20, 'Feed sin cobertura mínima de partidos'
          generated = d.get('generated_at')
          assert generated, 'generated_at ausente'
          ts = datetime.fromisoformat(generated.replace('Z', '+00:00'))
          age_h = (datetime.now(timezone.utc) - ts.astimezone(timezone.utc)).total_seconds() / 3600
          assert age_h < 3, f'Feed demasiado antiguo: {age_h:.1f} h'
          print(f'Feed vivo OK: {generated} · edad={age_h:.2f} h · partidos={len(d.get("matches", []))}')
          PY

      - name: Verificar alias de producción si responde públicamente
        continue-on-error: true
        run: |
          set -euo pipefail
          code="$(curl -L -sS -o /tmp/build-version.json -w '%{http_code}' --max-time 20 \
            'https://futbol-edge-porra1.vercel.app/build-version.json?t='"$(date +%s)" || true)"
          echo "HTTP producción: ${code}"
          if [ "$code" = "200" ]; then
            python -c 'import json; d=json.load(open("/tmp/build-version.json")); assert d.get("commit"); print("Producción pública responde build-version:", d.get("commit"))'
          else
            echo "Producción protegida/no pública; la verificación fuerte se hace en deploy-vercel.yml con VERCEL_TOKEN."
          fi
