name: Apply betting-time windows

on:
  push:
    branches: [feat/match-hero-prediction-timeline]

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/match-hero-prediction-timeline
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: football/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Aplicar integración ventanas de apuesta
        run: |
          python tools/apply_betting_windows_patch.py
          python tools/apply_betting_ui_labels.py
          python tools/apply_performance_windows_patch.py
      - name: Instalar backend
        working-directory: football
        run: |
          pip install -r requirements.txt
          pip install -e .
      - name: Verificar backend completo
        working-directory: football
        run: pytest -q
      - name: Verificar UI
        working-directory: app
        run: |
          npm ci
          npm test
          npm run lint
          npm run build
      - name: Publicar parche verificado
        run: |
          if git diff --quiet; then
            echo "Sin cambios por publicar"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add football/src/futbol_pred/operational.py football/src/futbol_pred/dashboard.py football/src/futbol_pred/performance.py football/tests/test_prediction_snapshots.py football/tests/test_operational_performance.py app/src/PredictionTimelinePanel.jsx app/src/predictionTimelineData.js app/src/predictionTimelineData.test.js app/src/match-timeline.css
          git commit -m "feat(predictions): expose and measure betting-time stages"
          git push origin HEAD:feat/match-hero-prediction-timeline
