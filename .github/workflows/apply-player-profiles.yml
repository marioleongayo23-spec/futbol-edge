name: Apply player profiles patch

on:
  push:
    branches: [feat/team-player-profiles]

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/team-player-profiles
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: football/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Aplicar parche reproducible
        run: python tools/apply_player_profiles_patch.py
      - name: Instalar backend
        working-directory: football
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Verificar contratos de Player Intelligence
        working-directory: football
        run: pytest -q tests/test_api_football_players.py tests/test_player_profile_enrichment.py
      - name: Verificar UI
        working-directory: app
        run: |
          npm ci
          npm test
          npm run lint
          npm run build
      - name: Publicar archivos parcheados en la rama
        run: |
          if git diff --quiet; then
            echo "Parche ya aplicado; no hay cambios que publicar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/App.jsx football/src/futbol_pred/dashboard.py football/src/futbol_pred/ingest/api_football_players.py
          git commit -m "feat(players): wire premium player profiles into feed and UI"
          git push origin HEAD:feat/team-player-profiles
