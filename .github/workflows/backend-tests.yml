name: Backend tests

on:
  pull_request:
    paths:
      - "football/**"
      - ".github/workflows/backend-tests.yml"
  push:
    branches: [main]
    paths:
      - "football/**"
      - "!football/data/**"
      - ".github/workflows/backend-tests.yml"

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: football
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: football/requirements.txt
      - name: Instalar backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Ejecutar suite Python
        run: pytest -q
