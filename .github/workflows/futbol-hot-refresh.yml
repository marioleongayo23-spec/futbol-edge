name: futbol-edge hot refresh

# Canal autoritativo de día de partido.
# La continuidad NO depende del cron: cada bloque activo se auto-despacha al terminar.
# El schedule y workflow_run son solo watchdogs para recuperar el heartbeat si GitHub
# o una incidencia externa interrumpen la cadena.
on:
  push:
    branches: [main]
    paths:
      - "football/**"
      - "!football/data/dashboard.json"
      - ".github/workflows/futbol-hot-refresh.yml"
  workflow_run:
    workflows: ["futbol-pred (cron)"]
    types: [completed]
    branches: [main]
  schedule:
    # Watchdog cada 30 min, desplazado del inicio de hora.
    - cron: "7,37 8-23 * * *"
      timezone: "Europe/Madrid"
    - cron: "7,37 0-1 * * *"
      timezone: "Europe/Madrid"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# Grupo v2: deja arrancar ya la versión con plantillas 2026/27 aunque quede
# terminando un heartbeat antiguo del grupo anterior.
concurrency:
  group: futbol-edge-hot-refresh-current-squads-v2
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias ligeras de matchday
        run: pip install requests

      - name: Refresco autoritativo de matchday y publicación
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          LOCAL_AI_BASE_URL: ${{ secrets.LOCAL_AI_BASE_URL }}
          LOCAL_AI_MODEL: ${{ secrets.LOCAL_AI_MODEL }}
          LOCAL_AI_API_KEY: ${{ secrets.LOCAL_AI_API_KEY }}
          AI_DAILY_CALL_BUDGET: "20"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Push de código: un tick inmediato. El resto de disparadores sostienen
          # aproximadamente una hora completa de ciclos de 5 minutos.
          cycles=1
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ "$GITHUB_EVENT_NAME" = "workflow_run" ] || [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            cycles=12
          fi
          echo "Evento ${GITHUB_EVENT_NAME}: ${cycles} ciclo(s) de matchday"

          for cycle in $(seq 1 "$cycles"); do
            echo "===== matchday cycle ${cycle}/${cycles} ====="
            pushed=0
            for attempt in 1 2 3 4; do
              git fetch origin main
              git reset --hard origin/main

              # 1) Un falso 'confirmado' nunca puede bloquear el polling oficial.
              PYTHONPATH=football/src python -m futbol_pred.matchday_confirmation_guard

              # 2) Estado, XI oficial y meteo con batching/cuota dinámica.
              PYTHONPATH=football/src python -m futbol_pred.hot_refresh_metered

              # 3) Plantillas ACTUALES 2026/27. LaLiga/Segunda se sanean desde
              #    football-data; API-Football queda como fallback de próximos.
              PYTHONPATH=football/src python -m futbol_pred.matchday_current_squads

              # 4) Última milla: si el XI llega muy tarde seguimos buscándolo.
              PYTHONPATH=football/src python -m futbol_pred.matchday_official_last_mile

              # 5) Base universal: último XI oficial mientras no haya probable fiable.
              PYTHONPATH=football/src python -m futbol_pred.matchday_lineup_baseline

              # 6) Lesiones/sanciones desde T-24h con cadencia adaptativa.
              PYTHONPATH=football/src python -m futbol_pred.matchday_absence_refresh

              # 7) T-24h..T-2h: recolector incremental de probables.
              PYTHONPATH=football/src python -m futbol_pred.matchday_early_probable_refresh

              # 8) T-2h: prensa reciente + continuidad oficial + muestra real.
              PYTHONPATH=football/src python -m futbol_pred.matchday_probable_refresh

              # 9) Reconciliación universal.
              PYTHONPATH=football/src python -m futbol_pred.matchday_lineup_baseline

              # 10) Revalida el XI final contra la plantilla actual.
              PYTHONPATH=football/src python -m futbol_pred.matchday_current_squads

              # 11) Barrera final: ningún XI no oficial puede contener una baja segura.
              PYTHONPATH=football/src python -m futbol_pred.matchday_lineup_integrity

              # 12) Predicciones individuales sobre el XI vigente.
              PYTHONPATH=football/src python -m futbol_pred.matchday_player_props_fill

              # 13) Cuotas con TTL dinámico según proximidad y créditos.
              PYTHONPATH=football/src python -m futbol_pred.matchday_market_refresh

              # 14) Reacción predictiva inmediata a clima/XI/bajas/mercado.
              PYTHONPATH=football/src python -m futbol_pred.matchday_prediction_refresh

              # 15) Gate de autoridad/frescura.
              PYTHONPATH=football/src python -m futbol_pred.matchday_freshness_gate

              # 16) Matriz de cobertura/frescura visible.
              PYTHONPATH=football/src python -m futbol_pred.coverage
              PYTHONPATH=football/src python -m futbol_pred.matchday_diagnose

              if git diff --quiet -- football/data/dashboard.json; then
                echo "Sin cambios sustantivos en este ciclo"
                pushed=1
                break
              fi

              git add football/data/dashboard.json
              git commit -m "Actualizar datos y predicción intradía de Fútbol Edge"
              if git push origin HEAD:main; then
                pushed=1
                break
              fi

              echo "Publicación concurrente; recalculando sobre main (intento ${attempt})…"
              sleep $((attempt * 2))
            done
            [ "$pushed" = 1 ] || { echo "No se pudo publicar el ciclo ${cycle}"; exit 1; }

            if [ "$cycle" -lt "$cycles" ]; then
              sleep 300
            fi
          done

      - name: Mantener vivo el heartbeat de matchday
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          hour=$(TZ=Europe/Madrid date +%H)
          hour=$((10#$hour))

          if [ "$hour" -ge 8 ] || [ "$hour" -le 1 ]; then
            echo "Autoencadenando siguiente bloque de refresco…"
            curl --fail-with-body --retry 3 --retry-all-errors \
              -L -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/futbol-hot-refresh.yml/dispatches" \
              -d '{"ref":"main"}'
          else
            echo "Fuera de ventana matchday; no se autoencadena."
          fi
