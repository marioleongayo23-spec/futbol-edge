name: futbol-edge hot refresh

# Canal ligero para información que cambia cerca del partido. No reentrena el
# modelo ni sustituye al pipeline completo: prioriza latencia mínima para clima,
# estado, XI oficial, bajas y cuotas del mismo día.
on:
  schedule:
    # Cada 5 min, evitando el minuto 00 donde GitHub documenta más retrasos.
    # Europe/Madrid mantiene la ventana estable con DST: 08:03-01:58 local.
    # La lógica interna decide si cada fuente necesita consulta y aplica guardas
    # de cuota; despertarse cada 5 min NO implica gastar API en cada ejecución.
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 8-23 * * *"
      timezone: "Europe/Madrid"
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 0-1 * * *"
      timezone: "Europe/Madrid"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: futbol-edge-hot-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencia HTTP mínima
        run: pip install requests

      - name: Refrescar y publicar sobre la última main
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pushed=0
          for i in 1 2 3 4; do
            # El pipeline pesado puede publicar en paralelo. Partimos SIEMPRE de
            # la última main y, si hay carrera al hacer push, recalculamos sobre
            # el feed ganador en vez de sobrescribirlo.
            git fetch origin main
            git reset --hard origin/main

            # API-Football: estado/XI/bajas con batching y telemetría de cuota.
            PYTHONPATH=football/src python -m futbol_pred.hot_refresh_metered

            # The Odds API: una llamada destacada por liga solo cuando vence el
            # TTL dinámico del partido. Actualiza 1X2/O-U/value y recalibra la
            # capa mercado↔modelo sin tocar model_probs.
            PYTHONPATH=football/src python -m futbol_pred.matchday_market_refresh

            # La cobertura cambia también al cruzar ventanas aunque la fuente
            # todavía no haya publicado un dato; hacerlo visible evita "pendiente"
            # ambiguo en el seguimiento operativo.
            PYTHONPATH=football/src python -m futbol_pred.coverage

            if git diff --quiet -- football/data/dashboard.json; then
              echo "Sin cambios rápidos sustantivos"
              pushed=1
              break
            fi

            git add football/data/dashboard.json
            git commit -m "Actualizar datos intradía de Fútbol Edge"
            if git push origin HEAD:main; then
              pushed=1
              break
            fi

            echo "Publicación concurrente; recalculando sobre main (intento $i)…"
            sleep $((i * 2))
          done
          [ "$pushed" = 1 ] || { echo "No se pudo publicar el hot refresh"; exit 1; }
