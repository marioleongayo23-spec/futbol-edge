name: futbol-edge hot refresh

# Canal autoritativo de día de partido. GitHub Actions puede retrasar o saltarse
# eventos schedule, por eso cada arranque automático mantiene un heartbeat
# autosostenido de 12 ciclos separados 5 minutos (~55 min de cobertura).
# Los push de código hacen solo un ciclo inmediato; schedule, workflow_run y
# manual sostienen el bloque. La concurrencia conserva un job en curso y como
# máximo un pendiente reciente, evitando una cola creciente de bloques viejos.
on:
  push:
    branches: [main]
    paths-ignore:
      - "football/data/dashboard.json"
  workflow_run:
    workflows: ["futbol-pred (cron)"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "4,24,44 8-23 * * *"
      timezone: "Europe/Madrid"
    - cron: "4,24,44 0-1 * * *"
      timezone: "Europe/Madrid"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: futbol-edge-hot-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias ligeras de matchday
        run: pip install requests

      - name: Refresco autoritativo de matchday y publicación
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          LOCAL_AI_BASE_URL: ${{ secrets.LOCAL_AI_BASE_URL }}
          LOCAL_AI_MODEL: ${{ secrets.LOCAL_AI_MODEL }}
          LOCAL_AI_API_KEY: ${{ secrets.LOCAL_AI_API_KEY }}
          AI_DAILY_CALL_BUDGET: "20"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cycles=1
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            cycles=12
          fi
          echo "Evento ${GITHUB_EVENT_NAME}: ${cycles} ciclo(s) de matchday"

          for cycle in $(seq 1 "$cycles"); do
            echo "===== matchday cycle ${cycle}/${cycles} ====="
            pushed=0
            for attempt in 1 2 3 4; do
              git fetch origin main
              git reset --hard origin/main

              # 1) Un falso 'confirmado' nunca puede bloquear el polling oficial.
              PYTHONPATH=football/src python -m futbol_pred.matchday_confirmation_guard

              # 2) Estado, XI oficial y meteo con batching/cuota dinámica.
              PYTHONPATH=football/src python -m futbol_pred.hot_refresh_metered

              # 3) Última milla: si el XI llega después de T-10 seguimos buscándolo.
              PYTHONPATH=football/src python -m futbol_pred.matchday_official_last_mile

              # 4) T-2h: fuerza una foto reciente de bajas y la deduplica.
              PYTHONPATH=football/src python -m futbol_pred.matchday_absence_refresh

              # 5) T-8h..T-2h: construye/refresca el probable con antelación y
              #    genera props predictivas en cuanto haya 11+11 plausibles.
              PYTHONPATH=football/src python -m futbol_pred.matchday_early_probable_refresh

              # 6) T-2h: prensa reciente + continuidad oficial + muestra real disponible.
              PYTHONPATH=football/src python -m futbol_pred.matchday_probable_refresh

              # 7) Un probable no puede contener una baja oficial.
              PYTHONPATH=football/src python -m futbol_pred.matchday_lineup_integrity

              # 8) Cobertura 22/22 de predicciones individuales: real cuando existe,
              #    estimación explícita por rol/equipo solo para huecos sin muestra.
              PYTHONPATH=football/src python -m futbol_pred.matchday_player_props_fill

              # 9) Cuotas con TTL dinámico según proximidad y créditos.
              PYTHONPATH=football/src python -m futbol_pred.matchday_market_refresh

              # 10) Reacción predictiva inmediata a clima/XI/bajas/mercado.
              PYTHONPATH=football/src python -m futbol_pred.matchday_prediction_refresh

              # 11) Certifica autoridad/frescura y bloquea apuestas si no está ready.
              PYTHONPATH=football/src python -m futbol_pred.matchday_freshness_gate

              # 12) Matriz de cobertura/frescura visible.
              PYTHONPATH=football/src python -m futbol_pred.coverage

              PYTHONPATH=football/src python -m futbol_pred.matchday_diagnose

              if git diff --quiet -- football/data/dashboard.json; then
                echo "Sin cambios sustantivos en este ciclo"
                pushed=1
                break
              fi

              git add football/data/dashboard.json
              git commit -m "Actualizar datos y predicción intradía de Fútbol Edge"
              if git push origin HEAD:main; then
                pushed=1
                break
              fi

              echo "Publicación concurrente; recalculando sobre main (intento ${attempt})…"
              sleep $((attempt * 2))
            done
            [ "$pushed" = 1 ] || { echo "No se pudo publicar el ciclo ${cycle}"; exit 1; }

            if [ "$cycle" -lt "$cycles" ]; then
              sleep 300
            fi
          done
