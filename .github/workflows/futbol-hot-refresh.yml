name: futbol-edge hot refresh

# Canal autoritativo de día de partido. Los ticks programados son independientes
# para que un schedule retrasado/descartado por GitHub no deje una hora completa
# sin refresco. workflow_run y manual mantienen además un heartbeat de respaldo
# de 12 ciclos separados 5 minutos (~55 min de cobertura).
on:
  push:
    branches: [main]
    paths-ignore:
      - "football/data/dashboard.json"
  workflow_run:
    workflows: ["futbol-pred (cron)"]
    types: [completed]
    branches: [main]
  schedule:
    # Desplazado dos minutos del inicio de hora para evitar la franja de mayor
    # carga de GitHub Actions. Intervalo mínimo soportado por GitHub: 5 minutos.
    - cron: "2-57/5 8-23 * * *"
      timezone: "Europe/Madrid"
    - cron: "2-57/5 0-1 * * *"
      timezone: "Europe/Madrid"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: futbol-edge-hot-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias ligeras de matchday
        run: pip install requests

      - name: Refresco autoritativo de matchday y publicación
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          LOCAL_AI_BASE_URL: ${{ secrets.LOCAL_AI_BASE_URL }}
          LOCAL_AI_MODEL: ${{ secrets.LOCAL_AI_MODEL }}
          LOCAL_AI_API_KEY: ${{ secrets.LOCAL_AI_API_KEY }}
          AI_DAILY_CALL_BUDGET: "20"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Un schedule normal hace exactamente un tick: GitHub vuelve a lanzar
          # otro a los 5 minutos. workflow_run/manual sostienen un bloque de
          # respaldo para cubrir huecos si GitHub retrasa algún schedule.
          cycles=1
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            cycles=12
          fi
          echo "Evento ${GITHUB_EVENT_NAME}: ${cycles} ciclo(s) de matchday"

          for cycle in $(seq 1 "$cycles"); do
            echo "===== matchday cycle ${cycle}/${cycles} ====="
            pushed=0
            for attempt in 1 2 3 4; do
              git fetch origin main
              git reset --hard origin/main

              # 1) Un falso 'confirmado' nunca puede bloquear el polling oficial.
              PYTHONPATH=football/src python -m futbol_pred.matchday_confirmation_guard

              # 2) Estado, XI oficial y meteo con batching/cuota dinámica.
              PYTHONPATH=football/src python -m futbol_pred.hot_refresh_metered

              # 3) Última milla: si el XI llega muy tarde seguimos buscándolo.
              PYTHONPATH=football/src python -m futbol_pred.matchday_official_last_mile

              # 4) Base universal: último XI oficial de cada equipo mientras no
              #    exista un probable fiable. Recupera/cacha el histórico si falta.
              PYTHONPATH=football/src python -m futbol_pred.matchday_lineup_baseline

              # 5) Bajas/sanciones desde T-24h, con cadencia mayor al acercarse.
              PYTHONPATH=football/src python -m futbol_pred.matchday_absence_refresh

              # 6) T-24h..T-2h: busca prensa/onces probables de forma incremental.
              PYTHONPATH=football/src python -m futbol_pred.matchday_early_probable_refresh

              # 7) T-2h: prensa reciente + continuidad oficial + muestra real disponible.
              PYTHONPATH=football/src python -m futbol_pred.matchday_probable_refresh

              # 8) Reconciliación universal: model-only vuelve al último XI oficial;
              #    evidencia parcial crea híbrido seguro; grounded/oficial prevalece.
              #    También sanea titulares con bajas/sanciones oficiales.
              PYTHONPATH=football/src python -m futbol_pred.matchday_lineup_baseline

              # 9) Barrera final crítica: ningún XI no oficial contiene una baja segura.
              PYTHONPATH=football/src python -m futbol_pred.matchday_lineup_integrity

              # 10) Cobertura de predicciones individuales sobre el XI vigente.
              PYTHONPATH=football/src python -m futbol_pred.matchday_player_props_fill

              # 11) Cuotas con TTL dinámico según proximidad y créditos.
              PYTHONPATH=football/src python -m futbol_pred.matchday_market_refresh

              # 12) Reacción predictiva inmediata a clima/XI/bajas/mercado.
              PYTHONPATH=football/src python -m futbol_pred.matchday_prediction_refresh

              # 13) Certifica autoridad/frescura y bloquea apuestas si no está ready.
              PYTHONPATH=football/src python -m futbol_pred.matchday_freshness_gate

              # 14) Matriz de cobertura/frescura visible.
              PYTHONPATH=football/src python -m futbol_pred.coverage

              PYTHONPATH=football/src python -m futbol_pred.matchday_diagnose

              if git diff --quiet -- football/data/dashboard.json; then
                echo "Sin cambios sustantivos en este ciclo"
                pushed=1
                break
              fi

              git add football/data/dashboard.json
              git commit -m "Actualizar datos y predicción intradía de Fútbol Edge"
              if git push origin HEAD:main; then
                pushed=1
                break
              fi

              echo "Publicación concurrente; recalculando sobre main (intento ${attempt})…"
              sleep $((attempt * 2))
            done
            [ "$pushed" = 1 ] || { echo "No se pudo publicar el ciclo ${cycle}"; exit 1; }

            if [ "$cycle" -lt "$cycles" ]; then
              sleep 300
            fi
          done
