name: futbol-edge hot refresh

# Canal autoritativo de día de partido. GitHub Actions puede retrasar eventos
# schedule, por eso los arranques programados mantienen un bloque interno de
# cuatro ciclos a 5 minutos. Los triggers auxiliares hacen un único ciclo para
# sincronizar sin crear una cola creciente de bloques antiguos.
on:
  push:
    branches: [main]
    paths-ignore:
      - "football/data/dashboard.json"
  workflow_run:
    workflows: ["futbol-pred (cron)"]
    types: [completed]
    branches: [main]
  schedule:
    # Un bloque cada 20 min; dentro del job se ejecutan 4 ciclos separados 5 min.
    # Evitamos minuto 00, donde los schedules suelen sufrir más retrasos.
    - cron: "4,24,44 8-23 * * *"
      timezone: "Europe/Madrid"
    - cron: "4,24,44 0-1 * * *"
      timezone: "Europe/Madrid"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: futbol-edge-hot-refresh
  # Nunca matamos un bloque que ya protege un partido. Los triggers auxiliares
  # son de un solo ciclo, así que la cola se vacía rápido.
  cancel-in-progress: false

jobs:
  refresh:
    # Si nos dispara workflow_run, solo actuamos cuando el pipeline terminó bien.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias ligeras de matchday
        run: pip install requests

      - name: Refresco autoritativo T-2h y publicación
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          LOCAL_AI_BASE_URL: ${{ secrets.LOCAL_AI_BASE_URL }}
          LOCAL_AI_MODEL: ${{ secrets.LOCAL_AI_MODEL }}
          LOCAL_AI_API_KEY: ${{ secrets.LOCAL_AI_API_KEY }}
          AI_DAILY_CALL_BUDGET: "20"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cycles=1
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            cycles=4
          fi
          echo "Evento ${GITHUB_EVENT_NAME}: ${cycles} ciclo(s) de matchday"

          for cycle in $(seq 1 "$cycles"); do
            echo "===== matchday cycle ${cycle}/${cycles} ====="
            pushed=0
            for attempt in 1 2 3 4; do
              # Siempre partimos de la main ganadora para convivir con el pipeline pesado.
              git fetch origin main
              git reset --hard origin/main

              # 1) Un falso 'confirmado' nunca puede bloquear el polling oficial.
              PYTHONPATH=football/src python -m futbol_pred.matchday_confirmation_guard

              # 2) Estado, XI oficial y meteo con batching/cuota dinámica.
              PYTHONPATH=football/src python -m futbol_pred.hot_refresh_metered

              # 3) Última milla: si el XI llega después de T-10 seguimos buscándolo.
              PYTHONPATH=football/src python -m futbol_pred.matchday_official_last_mile

              # 4) T-2h: fuerza una foto reciente de bajas y la deduplica.
              PYTHONPATH=football/src python -m futbol_pred.matchday_absence_refresh

              # 5) T-2h: prensa reciente + continuidad oficial + props reales.
              #    Si no hay partido crítico, es prácticamente un no-op.
              PYTHONPATH=football/src python -m futbol_pred.matchday_probable_refresh

              # 6) Última barrera: un probable no puede contener una baja oficial.
              PYTHONPATH=football/src python -m futbol_pred.matchday_lineup_integrity

              # 7) Cuotas con TTL dinámico según proximidad y créditos.
              PYTHONPATH=football/src python -m futbol_pred.matchday_market_refresh

              # 8) Reacción predictiva inmediata a clima/XI/bajas/mercado.
              PYTHONPATH=football/src python -m futbol_pred.matchday_prediction_refresh

              # 9) Certifica autoridad/frescura y bloquea apuestas si no está ready.
              PYTHONPATH=football/src python -m futbol_pred.matchday_freshness_gate

              # 10) Matriz de cobertura/frescura visible.
              PYTHONPATH=football/src python -m futbol_pred.coverage

              # Diagnóstico legible en Actions, sin secretos ni cuerpo de artículos.
              PYTHONPATH=football/src python -m futbol_pred.matchday_diagnose

              if git diff --quiet -- football/data/dashboard.json; then
                echo "Sin cambios sustantivos en este ciclo"
                pushed=1
                break
              fi

              git add football/data/dashboard.json
              git commit -m "Actualizar datos y predicción intradía de Fútbol Edge"
              if git push origin HEAD:main; then
                pushed=1
                break
              fi

              echo "Publicación concurrente; recalculando sobre main (intento ${attempt})…"
              sleep $((attempt * 2))
            done
            [ "$pushed" = 1 ] || { echo "No se pudo publicar el ciclo ${cycle}"; exit 1; }

            # Solo el schedule/manual mantiene la ventana de 4 ciclos. Los triggers
            # auxiliares terminan tras el ciclo 1 y no acumulan trabajo obsoleto.
            if [ "$cycle" -lt "$cycles" ]; then
              sleep 300
            fi
          done
