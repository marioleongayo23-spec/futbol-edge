name: Apply player fair lines on PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/player-prop-fair-lines
          fetch-depth: 0
      - name: Add auditable fair-line probabilities
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('football/src/futbol_pred/ingest/api_football_players.py')
          text = path.read_text(encoding='utf-8')

          marker = 'MIN_PLAYER_MINUTES = 270\n'
          grids = '''MIN_PLAYER_MINUTES = 270\n\nFAIR_LINE_GRIDS = {\n    "r": (0.5, 1.5, 2.5, 3.5, 4.5),\n    "rp": (0.5, 1.5, 2.5),\n    "fc": (0.5, 1.5, 2.5, 3.5),\n    "fr": (0.5, 1.5, 2.5, 3.5),\n    "t": (0.5,),\n}\n'''
          if 'FAIR_LINE_GRIDS' not in text:
              if text.count(marker) != 1:
                  raise SystemExit('fair line grid marker not unique')
              text = text.replace(marker, grids, 1)

          rate_block = '''def _rate_per90(total, minutes: float) -> float:\n    if minutes <= 0:\n        return 0.0\n    return round(90.0 * _number(total) / minutes, 3)\n'''
          fair_helpers = '''\n\ndef _poisson_over(mean: float, line: float) -> float:\n    """P(X > line) para un baseline Poisson de conteos individuales."""\n\n    lam = max(0.0, _number(mean))\n    cutoff = max(0, int(math.floor(float(line))))\n    term = math.exp(-lam)\n    cdf = term\n    for k in range(1, cutoff + 1):\n        term *= lam / k\n        cdf += term\n    return max(0.0, min(1.0, 1.0 - cdf))\n\n\ndef _fair_odds(probability: float) -> float | None:\n    return round(1.0 / probability, 2) if probability > 0 else None\n\n\ndef _fair_lines_for_prop(prop: dict) -> dict[str, list[dict]]:\n    """Líneas teóricas sin vig; no representan cuotas disponibles de una casa."""\n\n    out: dict[str, list[dict]] = {}\n    for metric, lines in FAIR_LINE_GRIDS.items():\n        mean = max(0.0, _number(prop.get(metric)))\n        rows = []\n        for line in lines:\n            over_raw = _poisson_over(mean, line)\n            under_raw = 1.0 - over_raw\n            rows.append({\n                "line": line,\n                "over": round(over_raw, 4),\n                "under": round(under_raw, 4),\n                "fair_over_odds": _fair_odds(over_raw),\n                "fair_under_odds": _fair_odds(under_raw),\n            })\n        out[metric] = rows\n    return out\n'''
          if 'def _poisson_over(' not in text:
              if text.count(rate_block) != 1:
                  raise SystemExit('rate block not unique')
              text = text.replace(rate_block, rate_block + fair_helpers, 1)

          attach_marker = '''        prop["evidence_score"] = round(\n            3.0 * prop["g"] + 2.0 * prop["a"] + prop["r"] + 1.5 * prop["rp"]\n            + 0.6 * prop["fc"] + 0.6 * prop["fr"] + prop["t"],\n            3,\n        )\n        candidates.append(prop)\n'''
          attach_new = '''        prop["evidence_score"] = round(\n            3.0 * prop["g"] + 2.0 * prop["a"] + prop["r"] + 1.5 * prop["rp"]\n            + 0.6 * prop["fc"] + 0.6 * prop["fr"] + prop["t"],\n            3,\n        )\n        prop["fair_lines"] = _fair_lines_for_prop(prop)\n        prop["fair_model"] = "poisson_baseline"\n        candidates.append(prop)\n'''
          if attach_marker in text:
              text = text.replace(attach_marker, attach_new, 1)
          elif 'prop["fair_lines"] = _fair_lines_for_prop(prop)' not in text:
              raise SystemExit('fair lines attach marker not found')
          path.write_text(text, encoding='utf-8')

          # Match detail: panel solo se renderiza si existen fair_lines reales.
          path = Path('app/src/MatchDetail.jsx')
          text = path.read_text(encoding='utf-8')
          import_marker = 'import OfficialStatsPanel from "./OfficialStatsPanel";'
          import_new = 'import OfficialStatsPanel from "./OfficialStatsPanel";\nimport PlayerFairLines from "./PlayerFairLines";'
          if 'import PlayerFairLines from "./PlayerFairLines";' not in text:
              if text.count(import_marker) != 1:
                  raise SystemExit('PlayerFairLines import marker not unique')
              text = text.replace(import_marker, import_new, 1)

          render_marker = '''      {m.alineacion && <div className="section-anchor" id="match-lineup"><Alineacion m={m} a={m.alineacion} /></div>}\n      <LineupImpact impact={m.lineup_impact} home={m.home} away={m.away} />\n'''
          render_new = '''      {m.alineacion && <div className="section-anchor" id="match-lineup"><Alineacion m={m} a={m.alineacion} /></div>}\n      <PlayerFairLines match={m} />\n      <LineupImpact impact={m.lineup_impact} home={m.home} away={m.away} />\n'''
          if '<PlayerFairLines match={m} />' not in text:
              if text.count(render_marker) != 1:
                  raise SystemExit('PlayerFairLines render marker not unique')
              text = text.replace(render_marker, render_new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Validate and commit
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add football/src/futbol_pred/ingest/api_football_players.py app/src/MatchDetail.jsx
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Add fair lines for real player props"
          git push origin HEAD:chatgpt/player-prop-fair-lines
