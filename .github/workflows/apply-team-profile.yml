name: Apply premium team profile patch

on:
  push:
    branches: [feat/premium-team-profile]

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/premium-team-profile
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Aplicar integración
        run: python tools/apply_team_profile_patch.py
      - name: Verificar UI
        working-directory: app
        run: |
          npm ci
          npm test
          npm run lint
          npm run build
      - name: Publicar App parcheada
        run: |
          if git diff --quiet; then
            echo "Parche ya aplicado; no hay cambios que publicar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/App.jsx
          git commit -m "feat(teams): wire premium team intelligence into team page"
          git push origin HEAD:feat/premium-team-profile
