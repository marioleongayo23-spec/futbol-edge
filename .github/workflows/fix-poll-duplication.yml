name: Fix duplicate official poll helper

on:
  push:
    branches: [feat/betting-windows-v2]

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/betting-windows-v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: football/requirements.txt
      - name: Eliminar definición duplicada
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('football/src/futbol_pred/operational.py')
          text = p.read_text(encoding='utf-8')
          block = '''def _official_poll_window(minutes_to_kickoff: float, attempts: dict) -> str | None:\n    """Ventanas de publicación del XI: primero T-60 y fallback T-30."""\n    if 45 <= minutes_to_kickoff <= 75 and not attempts.get("T-60"):\n        return "T-60"\n    if 15 <= minutes_to_kickoff < 45 and not attempts.get("T-30"):\n        return "T-30"\n    return None\n\n\n'''
          count = text.count(block)
          if count != 2:
              raise SystemExit(f'Esperaba exactamente 2 helpers duplicados, encuentro {count}')
          text = text.replace(block + block, block, 1)
          if text.count('def _official_poll_window(') != 1:
              raise SystemExit('El helper debe quedar definido exactamente una vez')
          p.write_text(text, encoding='utf-8')
          PY
      - name: Verificar backend completo
        working-directory: football
        run: |
          pip install -r requirements.txt
          pip install -e .
          pytest -q
      - name: Publicar corrección
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add football/src/futbol_pred/operational.py
          git commit -m "fix(predictions): keep one official poll window helper"
          git push origin HEAD:feat/betting-windows-v2
