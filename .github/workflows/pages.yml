name: Deploy a GitHub Pages

# Publica la app (app/) en GitHub Pages en tu cuenta. URL:
#   https://marioleongayo23-spec.github.io/futbol-edge/
# Requiere una única activación manual: Settings -> Pages -> Source = GitHub Actions.
# Se despliega al hacer push a main, cada hora como red de seguridad y a mano.

on:
  push:
    branches: [main]
  schedule:
    - cron: "20 * * * *"   # cada hora, 20 min tras el cron del feed (red de seguridad; el push a main ya redepliega)
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo despliegue a la vez; no cancela el que esté en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Instalar dependencias
        run: npm ci
        working-directory: app

      - name: Empaquetar el feed más reciente como respaldo
        run: cp -f football/data/dashboard.json app/public/dashboard.json || true

      - name: Build (base = /futbol-edge/)
        run: npm run build
        working-directory: app
        env:
          BASE_PATH: /futbol-edge/

      - name: Evitar el procesado Jekyll
        run: touch app/dist/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
