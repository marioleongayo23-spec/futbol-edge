name: Apply market consensus movement patch on PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/market-consensus-movement
          fetch-depth: 0
      - name: Patch backend and source label
        run: |
          python - <<'PY'
          from pathlib import Path

          backend = Path('football/src/futbol_pred/ingest/football_data_uk.py')
          text = backend.read_text(encoding='utf-8')

          anchor = '''def _decode(resp: requests.Response) -> str:\n    """co.uk sirve CSV UTF-8 con BOM, pero sin charset en la cabecera, así que\n    requests lo decodifica como ISO-8859-1 y el BOM queda como 'ï»¿' pegado a la\n    primera columna ('Div'), rompiendo el DictReader. Forzamos utf-8-sig: quita\n    el BOM y respeta los acentos de los nombres de equipo."""\n    return resp.content.decode("utf-8-sig", errors="replace")\n'''
          helper = '''\n\ndef _movement_meta(row: dict) -> dict | None:\n    """Movimiento 1X2 con una sola fuente emparejada de apertura a última.\n\n    Prioriza el consenso ``Avg*`` cuando existen los seis precios; si la pareja\n    está incompleta cae a Bet365. Nunca mezcla apertura de una fuente con última\n    de otra. ``closing_1x2`` se conserva como alias compatible con feeds antiguos.\n    """\n\n    candidates = (\n        ("market_average", ("AvgH", "AvgD", "AvgA"), ("AvgCH", "AvgCD", "AvgCA")),\n        ("Bet365", ("B365H", "B365D", "B365A"), ("B365CH", "B365CD", "B365CA")),\n    )\n    for source, opening_cols, latest_cols in candidates:\n        opening_values = [_num(row.get(column)) for column in opening_cols]\n        latest_values = [_num(row.get(column)) for column in latest_cols]\n        if not all(value and value > 1 for value in opening_values + latest_values):\n            continue\n        opening = dict(zip(("1", "X", "2"), opening_values))\n        latest = dict(zip(("1", "X", "2"), latest_values))\n        return {\n            "source": "football-data.co.uk",\n            "movement_source": source,\n            "opening_1x2": opening,\n            "latest_1x2": latest,\n            "closing_1x2": latest,\n            "movement_pct": {\n                key: round(100 * (latest[key] - opening[key]) / opening[key], 1)\n                for key in opening\n            },\n        }\n    return None\n'''
          if '_movement_meta(' not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('decode anchor not unique')
              text = text.replace(anchor, anchor + helper, 1)

          old = '''            if odds:\n                opening = {"1": _num(row.get("B365H")), "X": _num(row.get("B365D")), "2": _num(row.get("B365A"))}\n                closing = {"1": _num(row.get("B365CH")), "X": _num(row.get("B365CD")), "2": _num(row.get("B365CA"))}\n                if all(opening.values()) and all(closing.values()):\n                    odds["_meta"] = {\n                        "source": "football-data.co.uk",\n                        "opening_1x2": opening,\n                        "closing_1x2": closing,\n                        "movement_pct": {key: round(100 * (closing[key] - opening[key]) / opening[key], 1) for key in opening},\n                    }\n                out.append({"div": div, "home": home, "away": away, "odds": odds})\n'''
          new = '''            if odds:\n                movement = _movement_meta(row)\n                if movement:\n                    odds["_meta"] = movement\n                out.append({"div": div, "home": home, "away": away, "odds": odds})\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'movement = _movement_meta(row)' not in text:
              raise SystemExit('odds movement block not found')
          backend.write_text(text, encoding='utf-8')

          ui = Path('app/src/MatchDetail.jsx')
          text = ui.read_text(encoding='utf-8')
          old_import = 'import { marketMovementRows } from "./markets";'
          new_import = 'import { marketMovementRows, marketMovementSourceLabel } from "./markets";'
          if old_import in text:
              text = text.replace(old_import, new_import, 1)
          elif new_import not in text:
              raise SystemExit('market import not found')
          old_note = '<p className="note source-note">Apertura → última cuota B365 · football-data.co.uk. Una bajada indica mayor apoyo del mercado; una subida, menor apoyo.</p>'
          new_note = '<p className="note source-note">Apertura → última cuota {marketMovementSourceLabel(odds)} · football-data.co.uk. Una bajada indica mayor apoyo del mercado; una subida, menor apoyo.</p>'
          if old_note in text:
              text = text.replace(old_note, new_note, 1)
          elif new_note not in text:
              raise SystemExit('market source note not found')
          ui.write_text(text, encoding='utf-8')
          PY
      - name: Validate and commit
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add football/src/futbol_pred/ingest/football_data_uk.py app/src/MatchDetail.jsx
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Use market consensus for odds movement"
          git push origin HEAD:chatgpt/market-consensus-movement
