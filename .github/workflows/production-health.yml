name: Production health

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}
  pull_request:
    paths:
      - ".github/workflows/production-health.yml"

permissions:
  contents: read

concurrency:
  group: production-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar feed vivo
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 5 --max-time 30 \
            "https://raw.githubusercontent.com/marioleongayo23-spec/futbol-edge/main/football/data/dashboard.json?t=$(date +%s)" \
            -o /tmp/dashboard.json

      - name: Gate de salud y frescura
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone

          with open('/tmp/dashboard.json', encoding='utf-8') as fh:
              d = json.load(fh)

          matches = d.get('matches') or []
          quality = d.get('feed_quality') or {}
          generated = d.get('generated_at')
          assert quality.get('valid') is True, f'feed_quality inválido: {quality}'
          assert generated, 'generated_at ausente'
          assert len(matches) >= 20, f'cobertura anormal: {len(matches)} partidos'

          ts = datetime.fromisoformat(str(generated).replace('Z', '+00:00')).astimezone(timezone.utc)
          age_min = (datetime.now(timezone.utc) - ts).total_seconds() / 60
          assert -5 <= age_min < 120, f'feed fuera de ventana de frescura: {age_min:.1f} min'

          audit = d.get('content_audit') or {}
          coverage = audit.get('coverage_summary') or {}
          incomplete = audit.get('incomplete') or []
          print(f'generated_at={generated}')
          print(f'edad_min={age_min:.1f}')
          print(f'partidos={len(matches)}')
          print(f'feed_quality.valid={quality.get("valid")}')
          print(f'partidos_hoy={audit.get("matches_today", 0)}')
          print(f'completos_hoy={audit.get("complete", 0)}')
          print(f'incompletos_hoy={len(incomplete)}')
          print('coverage_summary=', json.dumps(coverage, ensure_ascii=False, sort_keys=True))
          if incomplete:
              print('incomplete=', json.dumps(incomplete[:20], ensure_ascii=False))
          PY

  production-alias:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Comprobar alias público sin convertir protección en caída
        run: |
          set -euo pipefail
          code="$(curl -L -sS -o /tmp/page -w '%{http_code}' --max-time 20 \
            'https://futbol-edge-porra1.vercel.app/' || true)"
          echo "HTTP=${code}"
          case "$code" in
            200|401|403) exit 0 ;;
            *) echo "::error::Alias de producción no responde de forma saludable: HTTP ${code}"; exit 1 ;;
          esac
