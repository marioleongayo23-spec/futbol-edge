name: OpenFootball CC0 archive (daily)

# Separate historical-data archive. Does not use private APIs, cookies, odds
# providers, paid feeds, prediction weights or the serving dashboard JSON.
on:
  # Bootstrap immediately on first merge; subsequent data changes do not
  # retrigger the collector (daily cron handles those).
  push:
    branches: [main]
    paths:
      - ".github/workflows/openfootball-archive.yml"
  schedule:
    - cron: "17 7 * * *"
      timezone: "Europe/Madrid"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: edge-openfootball-open-data-archive
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    defaults:
      run:
        working-directory: football
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: football/requirements.txt

      - name: Instalar librerías existentes
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Recopilar resultados CC0 (4 archivos max)
        run: |
          python -m futbol_pred.openfootball_archive \
            --output data/open_sources/openfootball_observations.csv
          python -m futbol_pred.open_data_bridge \
            data/open_sources/openfootball_observations.csv /tmp/edge-openfootball-shadow.sqlite

      - name: Publicar SOLO revisiones históricas nuevas
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/open_sources/openfootball_observations.csv
          if git diff --cached --quiet; then
            echo "Sin cambios en OpenFootball; no crear commit"
            exit 0
          fi
          git commit -m "data: incorporar resultados históricos CC0 de OpenFootball"
          # Fast-forward concurrency is safe for unrelated production feed
          # updates; fail rather than force-push or overwrite newer data.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
