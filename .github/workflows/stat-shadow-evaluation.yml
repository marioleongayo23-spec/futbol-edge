name: Stat shadow evaluation P3.5

on:
  pull_request:
    paths:
      - "football/src/futbol_pred/stat_shadow.py"
      - "football/src/futbol_pred/stat_shadow_evaluation.py"
      - "football/src/futbol_pred/prediction_snapshots.py"
      - "football/tests/test_stat_shadow.py"
      - "football/tests/test_stat_shadow_evaluation.py"
      - ".github/workflows/stat-shadow-evaluation.yml"
  push:
    branches: [main]
    paths:
      - "football/src/futbol_pred/stat_shadow.py"
      - "football/src/futbol_pred/stat_shadow_evaluation.py"
      - "football/src/futbol_pred/prediction_snapshots.py"
      - ".github/workflows/stat-shadow-evaluation.yml"
  workflow_run:
    workflows: ["futbol-pred (cron)"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: football
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: football/requirements.txt

      - name: Instalar backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Tests P3.5 shadow
        run: |
          pytest -q \
            tests/test_stat_shadow.py \
            tests/test_stat_shadow_evaluation.py \
            tests/test_prediction_snapshots.py

      - name: Verificar aislamiento de producción
        run: |
          python - <<'PY'
          from pathlib import Path

          shadow = Path("src/futbol_pred/stat_shadow.py").read_text(encoding="utf-8")
          evaluator = Path("src/futbol_pred/stat_shadow_evaluation.py").read_text(encoding="utf-8")
          snapshots = Path("src/futbol_pred/prediction_snapshots.py").read_text(encoding="utf-8")
          dashboard = Path("src/futbol_pred/dashboard.py").read_text(encoding="utf-8")
          hot = Path("src/futbol_pred/hot_refresh.py").read_text(encoding="utf-8")
          pipeline = Path("src/futbol_pred/pipeline.py").read_text(encoding="utf-8")

          assert 'SCHEMA = "stat-shadow-v1"' in shadow
          assert 'SCHEMA = "stat-shadow-evaluation-v1"' in evaluator
          assert '"automatic_production_promotion": False' in shadow
          assert '"automatic_production_promotion": False' in evaluator
          assert '"affects_1x2": False' in shadow
          assert '"affects_1x2": False' in evaluator
          assert 'out["stat_challengers"] = shadow' in snapshots
          assert "stat_shadow" not in dashboard
          assert "stat_shadow" not in hot
          assert "stat_shadow" not in pipeline
          print("P3.5 shadow-only: sin wiring de producción")
          PY

  evaluate:
    needs: validate
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: football/requirements.txt

      - name: Instalar backend
        working-directory: football
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Evaluar challengers shadow contra truth store
        run: |
          python -m futbol_pred.stat_shadow_evaluation \
            --dashboard football/data/dashboard.json \
            --truth data-history/final_stats_truth.json \
            --output data-history/stat_shadow_evaluation.json

      - name: Publicar evaluación solo si existe evidencia prospectiva
        run: |
          if [ ! -f data-history/stat_shadow_evaluation.json ]; then
            echo "Aún no hay snapshots shadow evaluables; no se crea evidencia ficticia"
            exit 0
          fi

          generated="${RUNNER_TEMP}/stat_shadow_evaluation.generated.json"
          publish_root="${RUNNER_TEMP}/stat-shadow-publish"
          cp data-history/stat_shadow_evaluation.json "$generated"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git worktree add --detach "$publish_root" origin/main

          pushed=0
          for i in 1 2 3 4 5; do
            git -C "$publish_root" fetch origin main
            git -C "$publish_root" checkout --detach origin/main
            target="$publish_root/data-history/stat_shadow_evaluation.json"
            if [ -f "$target" ] && cmp -s "$generated" "$target"; then
              echo "Evaluación shadow sin cambios; no se publica"
              pushed=1
              break
            fi
            mkdir -p "$(dirname "$target")"
            cp "$generated" "$target"
            git -C "$publish_root" add data-history/stat_shadow_evaluation.json
            if git -C "$publish_root" diff --cached --quiet; then
              pushed=1
              break
            fi
            git -C "$publish_root" commit -m "Actualizar evaluación shadow de Fútbol Edge"
            if git -C "$publish_root" push origin HEAD:main; then
              pushed=1
              break
            fi
            echo "push concurrente; reintentando sobre main vivo (intento $i)…"
            sleep $((i * 3))
          done
          [ "$pushed" = 1 ] || { echo "No se pudo publicar evaluación shadow tras cinco intentos"; exit 1; }

      - name: Subir evaluación como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stat-shadow-evaluation
          path: data-history/stat_shadow_evaluation.json
          if-no-files-found: ignore
