name: smoke-test (datos reales)

# Prueba en vivo contra proveedores reales. No modifica el repositorio ni el feed:
# solo valida que las credenciales y el pipeline siguen funcionando.
on:
  push:
    branches:
      - main
    paths-ignore:
      - "football/data/**"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: football
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: football/requirements.txt

      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip check

      - name: Tests
        run: pytest -q

      - name: Pipeline con datos reales (LaLiga y Champions)
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          test -n "${FOOTBALL_DATA_API_KEY:-}" || { echo "::error::Falta FOOTBALL_DATA_API_KEY"; exit 1; }
          test -n "${API_FOOTBALL_KEY:-}" || { echo "::error::Falta API_FOOTBALL_KEY"; exit 1; }
          echo "### LaLiga ###"
          python -m futbol_pred.cli run --league laliga
          echo "### Champions ###"
          python -m futbol_pred.cli run --league champions
          echo "### Backtest LaLiga ###"
          python -m futbol_pred.cli backtest --league laliga

      # El feed oficial lo genera futbol-pred.yml. Este smoke no escribe data/**
      # para evitar que una validación de CI pueda degradar o sobrescribir producción.
