name: smoke-test (datos reales)

# Prueba en vivo: corre en los runners de GitHub (con internet) al hacer push
# a la rama de desarrollo. Valida que las claves (Secrets) llegan a las APIs.
# Se puede borrar cuando el circuito esté confirmado.

on:
  push:
    branches:
      - main
    # Evita bucle: el commit del feed (data/**) no vuelve a disparar el workflow.
    paths-ignore:
      - "football/data/**"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: football
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Tests
        run: pytest -q

      - name: Pipeline con datos reales (LaLiga y Champions)
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          echo "### LaLiga ###"
          python -m futbol_pred.cli run --league laliga
          echo "### Champions ###"
          python -m futbol_pred.cli run --league champions
          echo "### Backtest LaLiga ###"
          python -m futbol_pred.cli backtest --league laliga

      # NOTA: el feed (data/dashboard.json) lo genera y publica SOLO el cron
      # (futbol-pred.yml), que sí lleva la clave de IA. Antes este smoke-test
      # regeneraba el feed en cada push SIN claves de IA y borraba las previas y
      # alineaciones cacheadas. Por eso ya no toca el feed aquí.
