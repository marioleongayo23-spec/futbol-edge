name: Apply PR33 integration

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/market-value-calibration-hardening
          fetch-depth: 0
      - name: Ajustar marcadores del parche
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/apply_pr33_hardening.py')
          text = p.read_text(encoding='utf-8')
          old = '''text = replace_once(
              text,
              ''' + "'''  return (\n    <>\n      <div className=\"card\">\n        <div className=\"row\" style={{ justifyContent: \"space-between\" }}>\n'''" + ''',
              ''' + "'''  return (\n    <>\n      <GlobalValuePanel rows={globalValue} />\n      <div className=\"card\">\n        <div className=\"row\" style={{ justifyContent: \"space-between\" }}>\n'''" + ''',
              "GlobalValuePanel render",
          )'''
          new = '''text = replace_once(
              text,
              ''' + "'''  const nWithOdds = rows.filter((r) => r.haveAll).length;\n  return (\n    <>\n      <div className=\"card\">\n        <div className=\"row\" style={{ justifyContent: \"space-between\" }}>\n'''" + ''',
              ''' + "'''  const nWithOdds = rows.filter((r) => r.haveAll).length;\n  return (\n    <>\n      <GlobalValuePanel rows={globalValue} />\n      <div className=\"card\">\n        <div className=\"row\" style={{ justifyContent: \"space-between\" }}>\n'''" + ''',
              "GlobalValuePanel render",
          )'''
          if old in text:
              text = text.replace(old, new, 1)
          text = text.replace(
              "assert '_starter_props(' not in operational",
              "assert '\\ndef _starter_props(' not in operational",
          )
          p.write_text(text, encoding='utf-8')
          PY
      - name: Aplicar integración
        run: python tools/apply_pr33_hardening.py
      - name: Validar invariantes rápidas
        run: |
          python -m compileall -q football/src
          test -z "$(git diff -- app/src/feed.js)"
          grep -q "GlobalValuePanel" app/src/App.jsx
          grep -q "HistoricalQualityPanel" app/src/App.jsx
          grep -q "WeatherAdjustmentPanel" app/src/MatchDetail.jsx
          ! grep -q "^def _starter_props(" football/src/futbol_pred/operational.py
      - name: Commit y push en la rama
        run: |
          if git diff --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add football app tools/apply_pr33_hardening.py
          git commit -m "Integrar CLV mercados props clima y calibración"
          git push origin HEAD:chatgpt/market-value-calibration-hardening
