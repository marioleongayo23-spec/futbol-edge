name: Rebase verified betting windows

on:
  push:
    branches: [feat/betting-windows-v2]

permissions:
  contents: write

jobs:
  rebase-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/betting-windows-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: football/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Copiar bloque verificado sobre main actual
        run: |
          git fetch origin feat/match-hero-prediction-timeline
          git checkout origin/feat/match-hero-prediction-timeline -- \
            app/e2e/match-prediction-timeline.spec.js \
            app/src/MatchDetail.jsx \
            app/src/PredictionTimelinePanel.jsx \
            app/src/match-timeline.css \
            app/src/predictionTimelineData.js \
            app/src/predictionTimelineData.test.js \
            football/src/futbol_pred/dashboard.py \
            football/src/futbol_pred/ingest/probable_lineup_media.py \
            football/src/futbol_pred/operational.py \
            football/src/futbol_pred/performance.py \
            football/src/futbol_pred/prediction_snapshots.py \
            football/src/futbol_pred/prefinal_lineups.py \
            football/tests/test_operational_performance.py \
            football/tests/test_performance_betting_windows.py \
            football/tests/test_prediction_snapshots.py \
            football/tests/test_prefinal_lineups.py
      - name: Backend completo
        working-directory: football
        run: |
          pip install -r requirements.txt
          pip install -e .
          pytest -q
      - name: UI completa
        working-directory: app
        run: |
          npm ci
          npm test
          npm run lint
          npm run build
      - name: Publicar bloque rebasado
        run: |
          if git diff --cached --quiet && git diff --quiet; then
            echo "Main ya contiene el bloque"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app football
          git commit -m "feat(predictions): betting-time pre-final and official final stages"
          git push origin HEAD:feat/betting-windows-v2
