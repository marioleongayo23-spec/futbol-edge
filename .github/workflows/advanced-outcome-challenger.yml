name: Advanced outcome challenger P2.3

on:
  push:
    branches: [main]
    paths:
      - "football/data/advanced_stats_snapshots.json"
      - "football/src/futbol_pred/advanced_stats.py"
      - "football/src/futbol_pred/advanced_stats_export.py"
      - "football/src/futbol_pred/advanced_outcome_report.py"
      - "football/src/futbol_pred/backtest/advanced_residual.py"
      - "football/tests/test_advanced_stats*.py"
      - "football/tests/test_advanced_residual.py"
      - "football/tests/test_advanced_outcome_report.py"
      - ".github/workflows/advanced-outcome-challenger.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: football
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: football/requirements.txt

      - name: Instalar backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Validar contrato avanzado y anti-leakage
        run: |
          pytest -q \
            tests/test_advanced_stats.py \
            tests/test_advanced_stats_export.py \
            tests/test_advanced_residual.py \
            tests/test_advanced_outcome_report.py

      - name: Evaluar challenger P2.3
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m futbol_pred.advanced_outcome_report

      - name: Resumen de gobernanza
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("data/advanced_outcome_challenger.json")
          report = json.loads(path.read_text(encoding="utf-8"))
          assert report.get("affects_1x2") is False
          for league, row in (report.get("reports") or {}).items():
              print(
                  f"[{league}] status={row.get('status')} accepted={row.get('accepted')} "
                  f"archive={row.get('archive_snapshots')} impact_1x2={row.get('affects_1x2')}"
              )
          PY

      - name: Subir informe challenger
        uses: actions/upload-artifact@v4
        with:
          name: advanced-outcome-challenger
          path: football/data/advanced_outcome_challenger.json
          if-no-files-found: error
          retention-days: 30
