name: Apply match prediction timeline

on:
  push:
    branches: [feat/match-hero-prediction-timeline]

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/match-hero-prediction-timeline
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: football/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Aplicar integración Match Intelligence
        run: python tools/apply_match_timeline_patch.py
      - name: Verificar snapshots backend
        working-directory: football
        run: |
          pip install -r requirements.txt
          pip install -e .
          pytest -q tests/test_prediction_snapshots.py
      - name: Verificar UI
        working-directory: app
        run: |
          npm ci
          npm test
          npm run lint
          npm run build
      - name: Publicar MatchDetail parcheado
        run: |
          if git diff --quiet; then
            echo "Integración ya aplicada; no hay cambios."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/MatchDetail.jsx
          git commit -m "feat(matches): wire prediction intelligence into match detail"
          git push origin HEAD:feat/match-hero-prediction-timeline
