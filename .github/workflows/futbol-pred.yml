name: futbol-pred (cron)

# Pipeline pesado: refresca históricos, calendario, modelos y artefactos globales.
# El modo partido de 5 min vive en futbol-hot-refresh.yml y reacciona a clima,
# XI, bajas y cuotas sin repetir ingestas/entrenamientos caros.
# Secrets: FOOTBALL_DATA_API_KEY, API_FOOTBALL_KEY, ODDS_API_KEY, DATABASE_URL.

on:
  push:
    branches: [main]
    paths-ignore:
      - "football/data/dashboard.json"
  schedule:
    # Base/modelo: cada 30 min en horario operativo. Minutos desplazados del
    # inicio de hora para reducir retrasos/drop de schedule bajo carga en GitHub.
    - cron: "13,43 8-23 * * *"
      timezone: "Europe/Madrid"
    - cron: "13,43 0-1 * * *"
      timezone: "Europe/Madrid"
    # Madrugada: una vez por hora para calendario/backfills.
    - cron: "23 2-7 * * *"
      timezone: "Europe/Madrid"
  workflow_dispatch:
    inputs:
      force_ai:
        description: "Forzar IA fuera de ventana y saltar TTL (manual)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  predict:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: football
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install -e .

      # Los gates completos se ejecutan al cambiar código. El cron de datos no
      # necesita repetir toda la suite cada media hora.
      - name: Tests (fail-fast antes de predecir)
        if: github.event_name != 'schedule'
        run: pytest -q

      - name: Ejecutar pipeline
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          for league in laliga segunda champions; do
            echo "=== $league ==="
            python -m futbol_pred.cli run --league $league || true
          done

      - name: Generar feed protegido para Fútbol Edge
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          LOCAL_AI_BASE_URL: ${{ secrets.LOCAL_AI_BASE_URL }}
          LOCAL_AI_MODEL: ${{ secrets.LOCAL_AI_MODEL }}
          LOCAL_AI_API_KEY: ${{ secrets.LOCAL_AI_API_KEY }}
          AI_DAILY_CALL_BUDGET: "16"
          AI_REFRESH_RUN: ${{ github.event_name == 'schedule' && '1' || '0' }}
          FORCE_AI: ${{ github.event_name == 'workflow_dispatch' && inputs.force_ai && '1' || '0' }}
        run: |
          # Importante: el generador seguro aplica el último XI oficial ANTES del
          # guard de calidad. Si una fuente externa regresa temporalmente, conserva
          # el last-known-good sin convertir esa protección en un Run failed.
          python -m futbol_pred.dashboard_lineup_safe

          # Sobre el feed ya válido seguimos incorporando información cambiante.
          python -m futbol_pred.matchday_lineup_baseline
          python -m futbol_pred.matchday_absence_refresh
          python -m futbol_pred.matchday_early_probable_refresh
          python -m futbol_pred.matchday_probable_refresh
          python -m futbol_pred.matchday_lineup_baseline
          python -m futbol_pred.matchday_lineup_integrity
          python -m futbol_pred.coverage
          python - <<'PY'
          import json
          d = json.load(open("data/dashboard.json", encoding="utf-8"))
          q = d.get("feed_quality", {})
          a = d.get("content_audit", {})
          print("[feed] calidad:", q.get("score"), "| métricas:", q.get("metrics"))
          print("[coverage]", a.get("status"), "| completos:", a.get("complete"), "/", a.get("matches_today"), "| resumen:", a.get("coverage_summary"))
          PY

      - name: Publicar feed actualizado en la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          generated="${RUNNER_TEMP}/dashboard.generated.json"
          publish_root="${RUNNER_TEMP}/feed-publish"
          cp data/dashboard.json "$generated"
          git fetch origin "${GITHUB_REF_NAME}"
          git worktree add --detach "$publish_root" "origin/${GITHUB_REF_NAME}"
          pushed=0
          for i in 1 2 3 4 5; do
            git -C "$publish_root" fetch origin "${GITHUB_REF_NAME}"
            git -C "$publish_root" checkout --detach "origin/${GITHUB_REF_NAME}"
            current="$publish_root/football/data/dashboard.json"
            if [ -f "$current" ]; then
              current_hash="$(python -m futbol_pred.feed_semantic "$current")"
              generated_hash="$(python -m futbol_pred.feed_semantic "$generated")"
              if [ "$current_hash" = "$generated_hash" ]; then
                echo "El feed solo cambia en timestamps volátiles; no se publica"
                pushed=1
                break
              fi
            fi
            cp "$generated" "$current"
            git -C "$publish_root" add football/data/dashboard.json
            if git -C "$publish_root" diff --cached --quiet; then
              echo "El feed no ha cambiado"
              pushed=1
              break
            fi
            git -C "$publish_root" commit -m "Actualizar feed automático de Fútbol Edge"
            if git -C "$publish_root" push origin "HEAD:${GITHUB_REF_NAME}"; then
              pushed=1
              break
            fi
            echo "push concurrente, reaplicando feed sobre main (intento $i)…"
            sleep $((i * 3))
          done
          [ "$pushed" = 1 ] || { echo "No se pudo publicar el feed tras cinco intentos limpios"; exit 1; }

      - name: Subir informes como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: predicciones
          path: football/data/*.json
          if-no-files-found: ignore

      - name: Verificar producción y feed publicado
        if: github.ref == 'refs/heads/main'
        run: |
          ok=0
          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 20 https://futbol-edge-snowy.vercel.app/ >/dev/null \
              && curl -fsS --max-time 20 https://raw.githubusercontent.com/marioleongayo23-spec/futbol-edge/main/football/data/dashboard.json \
                | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("feed_quality",{}).get("valid") is True'; then
              ok=1
              break
            fi
            sleep 12
          done
          [ "$ok" = 1 ] || { echo "Producción o feed no saludable"; exit 1; }
