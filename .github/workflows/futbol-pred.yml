name: futbol-pred (cron)

# Ejecuta el pipeline de predicción y publica el feed que consume Fútbol Edge.
# Las claves se configuran como Secrets del repo:
#   FOOTBALL_DATA_API_KEY, API_FOOTBALL_KEY, ODDS_API_KEY, DATABASE_URL (opcional)

on:
  # Valida y materializa el feed con el código recién fusionado. Se ignoran los
  # commits automáticos que solo cambian el propio feed para evitar un bucle.
  push:
    branches: [main]
    paths-ignore:
      - "football/data/dashboard.json"
  schedule:
    # Cada 15 min: durante los partidos los resultados aparecen casi al momento.
    # El commit solo se hace si el feed cambió, así que fuera de horario de
    # partidos no genera ruido. (GitHub puede retrasar el cron en picos.)
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      force_ai:
        description: "Forzar IA fuera de ventana y saltar TTL (manual)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  predict:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: football
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Tests (fail-fast antes de predecir)
        run: pytest -q

      - name: Ejecutar pipeline
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          for league in laliga segunda champions; do
            echo "=== $league ==="
            python -m futbol_pred.cli run --league $league || true
          done

      - name: Generar feed protegido para Fútbol Edge
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # IA: Gemini primero y Groq de fallback. El cron de resultados sigue
          # cada 15 min; la IA solo refresca partidos del día a las 00:15 y
          # 10:15 de Madrid, con caché entre ambas pasadas.
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          # Compatibilidad con la configuración Groq genérica anterior.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          # Tercer nivel opcional: endpoint gratuito/local OpenAI-compatible
          # (Ollama, vLLM o LM Studio). Después queda el motor determinista.
          LOCAL_AI_BASE_URL: ${{ secrets.LOCAL_AI_BASE_URL }}
          LOCAL_AI_MODEL: ${{ secrets.LOCAL_AI_MODEL }}
          LOCAL_AI_API_KEY: ${{ secrets.LOCAL_AI_API_KEY }}
          AI_DAILY_CALL_BUDGET: "16"
          AI_REFRESH_RUN: ${{ github.event_name == 'schedule' && '1' || '0' }}
          FORCE_AI: ${{ github.event_name == 'workflow_dispatch' && inputs.force_ai && '1' || '0' }}
        run: |
          python -m futbol_pred.dashboard
          python - <<'PY'
          import json
          d = json.load(open("data/dashboard.json", encoding="utf-8"))
          q = d.get("feed_quality", {})
          print("[feed] calidad:", q.get("score"), "| métricas:", q.get("metrics"))
          PY

      - name: Publicar feed actualizado en la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dashboard.json
          if git diff --cached --quiet; then
            echo "El feed no ha cambiado"
          else
            git commit -m "Actualizar feed automático de Fútbol Edge"
            # Robusto ante pushes concurrentes (cron + manual): rebase y reintenta.
            pushed=0
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then pushed=1; break; fi
              echo "push rechazado, reintento $i…"; sleep $((i * 3))
            done
            [ "$pushed" = 1 ] || { echo "No se pudo publicar el feed tras varios intentos"; exit 1; }
          fi

      - name: Subir informes como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: predicciones
          path: football/data/*.json
          if-no-files-found: ignore

      - name: Verificar producción y feed publicado
        if: github.ref == 'refs/heads/main'
        run: |
          ok=0
          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 20 https://futbol-edge-snowy.vercel.app/ >/dev/null \
              && curl -fsS --max-time 20 https://raw.githubusercontent.com/marioleongayo23-spec/futbol-edge/main/football/data/dashboard.json \
                | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("feed_quality",{}).get("valid") is True'; then
              ok=1
              break
            fi
            sleep 12
          done
          [ "$ok" = 1 ] || { echo "Producción o feed no saludable"; exit 1; }
