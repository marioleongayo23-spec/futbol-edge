name: futbol-pred (cron)

# Ejecuta el pipeline de predicción y publica el feed que consume Fútbol Edge.
# Las claves se configuran como Secrets del repo:
#   FOOTBALL_DATA_API_KEY, API_FOOTBALL_KEY, ODDS_API_KEY, DATABASE_URL (opcional)

on:
  schedule:
    # Cada 15 min: durante los partidos los resultados aparecen casi al momento.
    # El commit solo se hace si el feed cambió, así que fuera de horario de
    # partidos no genera ruido. (GitHub puede retrasar el cron en picos.)
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  predict:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: football
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Tests (fail-fast antes de predecir)
        run: pytest -q

      - name: Ejecutar pipeline
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          for league in laliga segunda champions; do
            echo "=== $league ==="
            python -m futbol_pred.cli run --league $league || true
          done

      - name: Generar feed para Fútbol Edge
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Acepta cualquiera de los dos nombres de secret para la IA.
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os, requests
          k = os.getenv("AI_API_KEY") or os.getenv("GEMINI_API_KEY") or ""
          print(f"[diag] clave IA detectada: {'SÍ, longitud '+str(len(k)) if k else 'NO'}")
          if k:
              m = os.getenv("GEMINI_MODEL", "gemini-2.0-flash")
              # ListModels NO consume cuota de generación: confirma si el modelo existe.
              try:
                  lm = requests.get("https://generativelanguage.googleapis.com/v1beta/models",
                                    params={"key": k, "pageSize": 100}, timeout=20)
                  names = [x.get("name", "") for x in (lm.json().get("models") or [])]
                  print(f"[gemini-diag] listmodels status={lm.status_code} tiene_{m}={'models/'+m in names}")
              except Exception as e:  # noqa: BLE001
                  print(f"[gemini-diag] listmodels error {type(e).__name__}")
              # Una generación mínima para ver 200 vs 429 (cuota).
              try:
                  g = requests.post(f"https://generativelanguage.googleapis.com/v1beta/models/{m}:generateContent",
                                    params={"key": k}, json={"contents":[{"parts":[{"text":"hola"}]}]}, timeout=30)
                  print(f"[gemini-diag] generate modelo={m} status={g.status_code} body={g.text[:200]}")
              except Exception as e:  # noqa: BLE001
                  print(f"[gemini-diag] generate error {type(e).__name__}")
          PY
          python -m futbol_pred.dashboard
          python - <<'PY'
          import json
          d = json.load(open("data/dashboard.json", encoding="utf-8"))
          ms = d["matches"]
          print("[diag] preview:", sum(1 for m in ms if m.get("preview")),
                "| alineacion:", sum(1 for m in ms if m.get("alineacion")),
                "| tendencias:", sum(1 for m in ms if m.get("tendencias")))
          PY

      - name: Publicar feed actualizado en la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dashboard.json
          if git diff --cached --quiet; then
            echo "El feed no ha cambiado"
          else
            git commit -m "Actualizar feed automático de Fútbol Edge"
            # Robusto ante pushes concurrentes (cron + manual): rebase y reintenta.
            pushed=0
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then pushed=1; break; fi
              echo "push rechazado, reintento $i…"; sleep $((i * 3))
            done
            [ "$pushed" = 1 ] || { echo "No se pudo publicar el feed tras varios intentos"; exit 1; }
          fi

      - name: Subir informes como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: predicciones
          path: football/data/*.json
          if-no-files-found: ignore
