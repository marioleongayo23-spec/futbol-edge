name: ai diag (manual)

# Diagnóstico BAJO DEMANDA de la IA. Solo lectura: dice si los secrets de IA
# llegan al pipeline, si el cliente los detecta (available()) y prueba las APIs
# de Gemini y Groq DIRECTAMENTE para mostrar el código HTTP y el error exacto si
# fallan (clave inválida, API no habilitada, cuota, etc.). Nunca imprime la clave.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: football
    env:
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      LOCAL_AI_BASE_URL: ${{ secrets.LOCAL_AI_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install -e .
      - name: Diagnóstico de IA
        run: |
          python - <<'PY'
          import os, requests
          from futbol_pred.ingest.ai_client import available, configured_providers, chat
          print("== secrets que llegan al workflow (solo longitud, no el valor) ==")
          for k in ("AI_API_KEY", "GEMINI_API_KEY", "GROQ_API_KEY", "GEMINI_MODEL",
                    "GROQ_MODEL", "OPENAI_API_KEY", "OPENAI_BASE_URL", "LOCAL_AI_BASE_URL"):
              v = (os.getenv(k) or "").strip()
              print(f"  {k}: {'SET (len=' + str(len(v)) + ')' if v else 'VACÍO / no configurado'}")
          print("== detección del cliente ==")
          print("  available():", available(), "| providers:", configured_providers())

          print("== Gemini directo (GET /v1beta/models) ==")
          gk = (os.getenv("AI_API_KEY") or os.getenv("GEMINI_API_KEY") or "").strip()
          if gk:
              try:
                  resp = requests.get("https://generativelanguage.googleapis.com/v1beta/models",
                                      params={"key": gk}, timeout=30)
                  print("  HTTP", resp.status_code)
                  if resp.status_code == 200:
                      names = [m.get("name") for m in resp.json().get("models", [])
                               if "generateContent" in (m.get("supportedGenerationMethods") or [])][:6]
                      print("  modelos con generateContent (muestra):", names)
                  else:
                      print("  ERROR body:", resp.text[:400])
              except Exception as exc:
                  print("  EXCEPCIÓN:", type(exc).__name__, "-", str(exc)[:200])
          else:
              print("  (sin clave Gemini)")

          print("== Groq directo (POST /openai/v1/chat/completions) ==")
          qk = (os.getenv("GROQ_API_KEY") or "").strip()
          if qk:
              try:
                  resp = requests.post("https://api.groq.com/openai/v1/chat/completions",
                                       headers={"Authorization": f"Bearer {qk}"},
                                       json={"model": os.getenv("GROQ_MODEL") or "llama-3.3-70b-versatile",
                                             "messages": [{"role": "user", "content": "di OK"}],
                                             "max_tokens": 5}, timeout=30)
                  print("  HTTP", resp.status_code)
                  if resp.status_code != 200:
                      print("  ERROR body:", resp.text[:400])
                  else:
                      print("  OK:", resp.json().get("choices", [{}])[0].get("message", {}).get("content"))
              except Exception as exc:
                  print("  EXCEPCIÓN:", type(exc).__name__, "-", str(exc)[:200])
          else:
              print("  (sin clave Groq)")

          print("== chat() del cliente (con fallback) ==")
          try:
              r = chat("Responde exactamente: OK", max_tokens=10, timeout=30)
              print("  ->", (r.provider, r.model, (r.text or "")[:40]) if r else "None")
          except Exception as exc:
              print("  EXCEPCIÓN:", type(exc).__name__, "-", str(exc)[:200])
          PY
