name: UI contracts and E2E

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "football/data/dashboard.json"

permissions:
  contents: read

jobs:
  ui:
    # Playwright 1.55 does not support Ubuntu 26.04 shipped by ubuntu-latest.
    # Pin a supported runner until the Playwright version is upgraded.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Instalar dependencias
        run: npm ci
        working-directory: app
      - name: Auditar dependencias runtime
        run: npm audit --omit=dev --audit-level=high
        working-directory: app
      - name: Contratos, lint y build
        run: npm test && npm run lint && npm run build
        working-directory: app
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
        working-directory: app
      - name: E2E escritorio y móvil
        run: npm run test:e2e
        working-directory: app
      - uses: actions/upload-artifact@v4
        # Keep desktop/mobile comparison screenshots on PRs for visual review,
        # including successful test runs. No additional hosted service needed.
        if: always() && github.event_name == 'pull_request'
        with:
          name: playwright-report-${{ github.run_id }}
          path: app/playwright-report
          if-no-files-found: ignore
          retention-days: 3
