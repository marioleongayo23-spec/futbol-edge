name: One-shot API-Football batch patch

on:
  push:
    branches: [chatgpt/api-football-batch-stats]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/api-football-batch-stats
          fetch-depth: 0
      - name: Patch grouped fixture details and stats normalization
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          path = Path('football/src/futbol_pred/ingest/api_football.py')
          text = path.read_text(encoding='utf-8')

          old_details = '''
              def get_fixture_details(self, fixture_ids: list[int]) -> dict[int, dict]:
                  """Agrupa hasta 20 fixtures detallados en una sola llamada de cuota."""

                  ids = [int(value) for value in dict.fromkeys(fixture_ids) if value][:20]
                  if self.offline or not ids:
                      return {}
                  try:
                      response = self._get("fixtures", {"ids": "-".join(map(str, ids))}).get("response") or []
                  except Exception:
                      return {}
                  return {
                      int((item.get("fixture") or {}).get("id")): item
                      for item in response if (item.get("fixture") or {}).get("id")
                  }
          '''
          new_details = '''
              def get_fixture_details(self, fixture_ids: list[int]) -> dict[int, dict]:
                  """Recupera fixtures detallados en lotes de 20 sin truncar la entrada.

                  API-Football permite ``/fixtures?ids=...`` con hasta 20 ids por
                  petición. Cada respuesta puede incluir events, lineups,
                  statistics y players según cobertura/plan. Un fallo de un lote
                  no descarta los lotes que sí respondieron.
                  """

                  ids = [int(value) for value in dict.fromkeys(fixture_ids) if value]
                  if self.offline or not ids:
                      return {}
                  out: dict[int, dict] = {}
                  for start in range(0, len(ids), 20):
                      chunk = ids[start:start + 20]
                      try:
                          response = self._get(
                              "fixtures", {"ids": "-".join(map(str, chunk))}
                          ).get("response") or []
                      except Exception:
                          continue
                      for item in response:
                          fixture_id = (item.get("fixture") or {}).get("id")
                          if fixture_id:
                              out[int(fixture_id)] = item
                  return out
          '''

          old_context = '''
              @staticmethod
              def fixture_context(item: dict | None) -> dict:
                  """Normaliza metadatos avanzados sin mezclarlos con el snapshot prepartido."""

                  item = item or {}
                  fixture = item.get("fixture") or {}
                  venue = fixture.get("venue") or {}
                  context = {
                      "provider": "API-Football",
                      "referee": fixture.get("referee"),
                      "venue": venue.get("name"),
                      "city": venue.get("city"),
                  }
                  statistics = {}
                  aliases = {
                      "Ball Possession": "possession", "Total passes": "passes",
                      "Passes accurate": "passes_accurate", "Passes %": "pass_accuracy",
                      "Shots insidebox": "shots_inside_box", "Shots outsidebox": "shots_outside_box",
                      "Blocked Shots": "shots_blocked", "Goalkeeper Saves": "saves",
                      "Offsides": "offsides",
                  }
                  for team in item.get("statistics") or []:
                      name = str((team.get("team") or {}).get("name") or "")
                      values = {}
                      for row in team.get("statistics") or []:
                          key = aliases.get(row.get("type"))
                          if key and row.get("value") is not None:
                              values[key] = row["value"]
                      if name and values:
                          statistics[name] = values
                  if statistics:
                      context["live_or_post_stats"] = statistics
                  return {key: value for key, value in context.items() if value is not None and value != "" and value != {}}
          '''
          new_context = '''
              @staticmethod
              def _stat_value(value):
                  """Convierte porcentajes/cadenas numéricas del proveedor en números."""
                  if isinstance(value, str):
                      text = value.strip()
                      if text.endswith("%"):
                          text = text[:-1].strip()
                      try:
                          return float(text)
                      except ValueError:
                          return value
                  return value

              @staticmethod
              def fixture_context(item: dict | None) -> dict:
                  """Normaliza árbitro, sede y estadísticas embebidas del batch.

                  Las estadísticas son live/post-partido: se mantienen separadas
                  del snapshot prepartido para impedir leakage.
                  """

                  item = item or {}
                  fixture = item.get("fixture") or {}
                  venue = fixture.get("venue") or {}
                  context = {
                      "provider": "API-Football",
                      "referee": fixture.get("referee"),
                      "venue": venue.get("name"),
                      "city": venue.get("city"),
                  }
                  statistics = {}
                  aliases = {
                      "Total Shots": "shots", "Shots on Goal": "sot",
                      "Shots off Goal": "shots_off_target", "Blocked Shots": "shots_blocked",
                      "Shots insidebox": "shots_inside_box", "Shots outsidebox": "shots_outside_box",
                      "Corner Kicks": "corners", "Fouls": "fouls",
                      "Yellow Cards": "yellows", "Red Cards": "reds",
                      "Offsides": "offsides", "Ball Possession": "possession",
                      "Goalkeeper Saves": "saves", "Total passes": "passes",
                      "Passes accurate": "passes_accurate", "Passes %": "pass_accuracy",
                  }
                  for team in item.get("statistics") or []:
                      name = str((team.get("team") or {}).get("name") or "").strip()
                      values = {}
                      for row in team.get("statistics") or []:
                          key = aliases.get(row.get("type"))
                          if key and row.get("value") is not None:
                              values[key] = ApiFootballClient._stat_value(row["value"])
                      if name and values:
                          statistics[name] = values
                  if statistics:
                      context["live_or_post_stats"] = statistics
                  return {
                      key: value for key, value in context.items()
                      if value is not None and value != "" and value != {}
                  }
          '''

          old_details = textwrap.dedent(old_details)
          new_details = textwrap.dedent(new_details)
          old_context = textwrap.dedent(old_context)
          new_context = textwrap.dedent(new_context)

          if text.count(old_details) != 1:
              raise SystemExit(f'Expected one get_fixture_details block, found {text.count(old_details)}')
          if text.count(old_context) != 1:
              raise SystemExit(f'Expected one fixture_context block, found {text.count(old_context)}')

          text = text.replace(old_details, new_details, 1)
          text = text.replace(old_context, new_context, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Validate and commit
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add football/src/futbol_pred/ingest/api_football.py
          git commit -m "Expand grouped API-Football fixture statistics"
          git push origin HEAD:chatgpt/api-football-batch-stats
