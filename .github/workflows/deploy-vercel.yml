name: deploy vercel (CLI)

# Despliegue de producción robusto e independiente de la integración Git de
# Vercel (que puede quedar pausada por cuota o desconectada). Construye la SPA en
# el runner de GitHub y sube el resultado ya compilado a producción con la CLI de
# Vercel. Así la web puede publicarse sin depender del build remoto de Vercel.
#
# Solo se dispara con cambios de CÓDIGO (app/, vercel.json, scripts, .nvmrc). El
# feed de datos se sirve en vivo desde GitHub, así que sus commits no redeployan.
# Requiere un único secret del repo:
#   VERCEL_TOKEN -> vercel.com/account/settings/tokens (Create Token)
#
# Los IDs de equipo/proyecto no son credenciales y se fijan aquí para evitar
# depender de dos secrets adicionales que solo duplicaban configuración pública.
#
# Trigger de producción: este cambio de comentario reactiva explícitamente el
# workflow después de una integración de feed que también modifica scripts/.

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "vercel.json"
      - "scripts/**"
      - ".nvmrc"
      - ".github/workflows/deploy-vercel.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-vercel-prod
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: team_UezD7A1MDWJVnLCRCRh4bdOc
      VERCEL_PROJECT_ID: prj_x059Hz47Zb5f8g2ibGEwUVBpNtU2
      # Para que build-version.json lleve el commit real y el contrato lo valide.
      VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
      VERCEL_GIT_COMMIT_REF: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar token de Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::Falta el secret VERCEL_TOKEN"
            echo "Añádelo en GitHub → Settings → Secrets and variables → Actions."
            echo "Créalo en Vercel → Account Settings → Tokens."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Instalar Vercel CLI
        run: npm install -g vercel@latest

      - name: Descargar configuración de producción
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Construir (SPA + feed empaquetado + build-version)
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Validar build-version antes de publicar
        run: |
          set -euo pipefail
          expected="${{ github.sha }}"
          test -f app/dist/build-version.json
          built="$(python3 -c 'import json; print(json.load(open("app/dist/build-version.json"))["commit"])')"
          if [ "$built" != "$expected" ]; then
            echo "::error::build-version.json contiene $built y se esperaba $expected"
            exit 1
          fi
          echo "Artefacto validado para $expected"

      - name: Desplegar a producción
        id: deploy
        run: |
          set -euo pipefail
          url="$(vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Desplegado en: $url"

      - name: Verificar deployment autenticado
        run: |
          set -euo pipefail
          url="${{ steps.deploy.outputs.url }}"
          if [ -z "$url" ]; then
            echo "::error::Vercel no devolvió URL de deployment"
            exit 1
          fi
          # El dominio de producción está protegido por Vercel Authentication y
          # responde 302 a peticiones anónimas. Verificamos por CLI autenticada
          # para no confundir la protección SSO con un fallo de despliegue.
          vercel inspect "$url" --token="${{ secrets.VERCEL_TOKEN }}"
          echo "Deployment de producción verificado: $url"
