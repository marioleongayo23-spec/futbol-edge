[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "futbol-pred"
version = "0.1.0"
description = "Predicción de fútbol y apuestas (LaLiga, Segunda, Champions) + quiniela"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "requests>=2.31",
    "SQLAlchemy>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
xg = ["soccerdata>=1.6"]
scraper = ["playwright>=1.40"]  # scraper local de jugadores (Understat)

[project.scripts]
futbol-pred = "futbol_pred.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
